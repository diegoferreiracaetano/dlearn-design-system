// Configuração isolada do Detekt em Groovy
subprojects {
    // Aplica o plugin do detekt em cada subprojeto
    apply plugin: "io.gitlab.arturbosch.detekt"

    detekt {
        // Usa files() para garantir que o Gradle resolva os caminhos corretamente
        config.setFrom(files("${rootDir}/config/detekt/detekt.yml"))
        buildUponDefaultConfig = true
        allRules = false
        source.setFrom(files("src"))
    }

    // Usamos tasks.matching para evitar a dependência direta da classe Detekt no classpath do script
    tasks.configureEach { task ->
        if (task.class.name.startsWith("io.gitlab.arturbosch.detekt.Detekt") && !task.class.name.contains("CreateBaseline")) {
            task.jvmTarget = "21"
            task.exclude "**/build/**"

            task.reports {
                html.required.set(true)
                xml.required.set(true)
                txt.required.set(false)
            }
        }
    }
}

// Tarefa na raiz para rodar detekt em tudo de uma vez
tasks.register("detektAll") {
    group = "verification"
    description = "Runs Detekt on all subprojects"

    dependsOn(
        subprojects.flatMap { sub ->
            sub.tasks.matching { it.class.name.startsWith("io.gitlab.arturbosch.detekt.Detekt") }
        }
    )
}
